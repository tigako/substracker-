services:
  db:
    image: postgres:16
    container_name: substracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: substracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: substracker
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: